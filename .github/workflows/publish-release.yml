name: "Publish release"

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: "${{ github.ref_name }}"
      release-name:
        required: false
        type: string
        default: "${{ github.ref_name }}"
      release-body:
        required: false
        type: string
        default: ""
    secrets:
      github-token:
        required: false

jobs:
  publish-release:
    name: "Publish release"
    runs-on: "ubuntu-latest"
    container:
      image: "ghcr.io/glpi-project/githubactions-glpi-apache:latest"
      options: --user 1001 # using built-in image user, otherwise GitHub Actions can't write file to the container
    steps:
      - name: "Checkout setup.php"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.tag }}"
          sparse-checkout: setup.php
          path: tmp_setup
          persist-credentials: false
      - name: "Get Plugin Key"
        run: |
          PLUGIN_KEY=$(sed --quiet 's/.*function plugin_version_\([a-z0-9_]\+\).*/\1/p' tmp_setup/setup.php | head --lines=1)
          if [ -z "$PLUGIN_KEY" ]; then
            echo "Could not extract plugin key from setup.php"
            exit 1
          fi
          echo "PLUGIN_KEY=$PLUGIN_KEY" >> "$GITHUB_ENV"
      - name: "Checkout Plugin"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.tag }}"
          fetch-tags: true
          fetch-depth: 0
          path: plugins/${{ env.PLUGIN_KEY }}
          persist-credentials: false
      - name: "Link Plugin to GLPI"
        run: |
          sudo ln -s "$GITHUB_WORKSPACE/plugins/$PLUGIN_KEY" "/var/www/glpi/plugins/$PLUGIN_KEY"
          # Fix permissions for logs and other writable dirs
          # Open the whole tree for writing so any tool (present or future) can write wherever it needs to.
          sudo mkdir -p /var/www/glpi/tests/files/_log
          sudo chmod -R a+rwX /var/www/glpi/
          # Ensure git trusts the directory
          git config --global --add safe.directory '*'
      - name: "Build release archive"
        working-directory: /var/www/glpi/
        env:
          INPUT_TAG: "${{ inputs.tag }}"
        run: |
          php bin/console tools:plugin:release --plugin="${PLUGIN_KEY}" --dest="plugins/${PLUGIN_KEY}/dist/glpi-${PLUGIN_KEY}-${INPUT_TAG}.tar.bz2" --no-interaction --force --verbose
          PACKAGE_PATH=$(find "/var/www/glpi/plugins/${PLUGIN_KEY}/dist/" -type f -name '*.tar.bz2')
          DELIMITER="EOF_$(od --address-radix=n --read-bytes=16 --format=x1 /dev/urandom | tr --delete ' \n')"
          {
            printf '%s\n' "PACKAGE_PATH<<${DELIMITER}"
            printf '%s\n' "${PACKAGE_PATH}"
            printf '%s\n' "${DELIMITER}"
            printf '%s\n' "PACKAGE_BASENAME<<${DELIMITER}"
            basename "${PACKAGE_PATH}"
            printf '%s\n' "${DELIMITER}"
          } >> "$GITHUB_ENV"
      - name: "Compute values"
        working-directory: /var/www/glpi/plugins/${{ env.PLUGIN_KEY }}/
        shell: bash -e {0}
        env:
          INPUT_TAG: "${{ inputs.tag }}"
          INPUT_RELEASE_NAME: "${{ inputs.release-name }}"
          INPUT_RELEASE_BODY: "${{ inputs.release-body }}"
        run: |
          TAG_NAME="${INPUT_TAG}"
          RELEASE_NAME="${INPUT_RELEASE_NAME}"
          RELEASE_BODY="${INPUT_RELEASE_BODY}"
          if [[ -z "${RELEASE_BODY}" && -f "CHANGELOG.md" ]]; then
            RELEASE_BODY="See [CHANGELOG.md](CHANGELOG.md) for changes details."
          fi
          MIN_GLPI=$(grep -oP "define\s*\(\s*['\"]PLUGIN_[A-Z]+_MIN_GLPI['\"]\s*,\s*['\"]\K[^'\"]+(?=['\"])" setup.php 2>/dev/null || true)
          MAX_GLPI=$(grep -oP "define\s*\(\s*['\"]PLUGIN_[A-Z]+_MAX_GLPI['\"]\s*,\s*['\"]\K[^'\"]+(?=['\"])" setup.php 2>/dev/null || true)
          if [[ -n "${MIN_GLPI}" && -n "${MAX_GLPI}" ]]; then
            COMPAT="**Compatible GLPI**: ${MIN_GLPI} -- ${MAX_GLPI}"
            if [[ -n "${RELEASE_BODY}" ]]; then
              RELEASE_BODY="${COMPAT}"$'\n\n'"${RELEASE_BODY}"
            else
              RELEASE_BODY="${COMPAT}"
            fi
          fi
          if [[ $( echo "${TAG_NAME}" | grep --extended-regexp "\-(alpha|beta|rc)[0-9]*$" ) ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          DELIMITER="EOF_$(od --address-radix=n --read-bytes=16 --format=x1 /dev/urandom | tr --delete ' \n')"
          {
            printf '%s\n' "TAG_NAME<<${DELIMITER}"
            printf '%s\n' "${TAG_NAME}"
            printf '%s\n' "${DELIMITER}"
            printf '%s\n' "RELEASE_NAME<<${DELIMITER}"
            printf '%s\n' "${RELEASE_NAME}"
            printf '%s\n' "${DELIMITER}"
            printf '%s\n' "RELEASE_BODY<<${DELIMITER}"
            printf '%s\n' "${RELEASE_BODY}"
            printf '%s\n' "${DELIMITER}"
          } >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"
      - name: "Create release"
        uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
        with:
          github-token: ${{ secrets.github-token || github.token }}
          script: |
            try {
              const fs = await import('fs');
              const release = await github.rest.repos.createRelease(
                {
                  tag_name: process.env.TAG_NAME,
                  name: process.env.RELEASE_NAME,
                  body: process.env.RELEASE_BODY,
                  draft: true,
                  prerelease: process.env.PRERELEASE === 'true',
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
              await github.rest.repos.uploadReleaseAsset(
                {
                  release_id: release.data.id,
                  name: process.env.PACKAGE_BASENAME,
                  data: fs.readFileSync(process.env.PACKAGE_PATH),
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
              await github.rest.repos.updateRelease(
                {
                  release_id: release.data.id,
                  draft: false,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
            } catch (error) {
              core.setFailed(error.message);
            }
      - name: "Verify XML download URL"
        if: ${{ !cancelled() }}
        working-directory: plugins/${{ env.PLUGIN_KEY }}/
        shell: bash -e {0}
        run: |
          XML_FILE=""
          for candidate in "plugin.xml" "${PLUGIN_KEY}.xml"; do
            if [[ -f "$candidate" ]]; then
              XML_FILE="$candidate"
              break
            fi
          done
          if [[ -z "$XML_FILE" ]]; then
            echo "No plugin XML file found, skipping check."
            exit 0
          fi
          EXPECTED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${PACKAGE_BASENAME}"
          XML_URL=$(grep -oP '(?<=<download_url>)[^<]+' "$XML_FILE" | grep "/${TAG_NAME}/" | head -1)
          if [[ -z "$XML_URL" ]]; then
            echo "No <download_url> entry for tag ${TAG_NAME} in $XML_FILE, skipping check."
            exit 0
          fi
          if [[ "$XML_URL" != "$EXPECTED_URL" ]]; then
            echo "❌ URL mismatch in $XML_FILE:"
            echo "   Found:       $XML_URL"
            echo "   Working URL: $EXPECTED_URL"
            exit 1
          fi
          echo "✅ XML download URL matches the published asset: $XML_URL"

name: "Publish release"

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: "${{ github.ref_name }}"
      release-name:
        required: false
        type: string
        default: "${{ github.ref_name }}"
      release-body:
        required: false
        type: string
        default: ""

jobs:
  publish-release:
    name: "Publish release"
    runs-on: "ubuntu-latest"
    container:
      image: "ghcr.io/glpi-project/plugin-builder"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          ref: "${{ inputs.tag }}"
          fetch-tags: true
      - name: "Build release archive"
        run: |
          composer install --no-progress --no-suggest --no-interaction --prefer-dist
          git config --global --add safe.directory $(pwd)
          vendor/bin/plugin-release --assume-yes --dont-check --nogithub --nosign --release "${{ inputs.tag }}" --verbose
          echo "PACKAGE_BASENAME=$(find "$(pwd)/dist/" -type f -name '*.tar.bz2' | xargs -n 1 basename)" >> $GITHUB_ENV
          echo "PACKAGE_PATH=$(find "$(pwd)/dist/" -type f -name '*.tar.bz2')" >> $GITHUB_ENV
      - name: "Compute values"
        run: |
          TAG_NAME="${{ inputs.tag }}"
          RELEASE_NAME="${{ inputs.release-name }}"
          RELEASE_BODY="${{ inputs.release-body }}"
          if [[ -z "${RELEASE_BODY}" && -f "CHANGELOG.md" ]]; then
            RELEASE_BODY="See [CHANGELOG.md](CHANGELOG.md) for changes details."
          fi
          if [[ $( echo ${TAG_NAME} | grep -E "\-(alpha|beta|rc)[0-9]*$" ) ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          echo "RELEASE_BODY=${RELEASE_BODY}" >> $GITHUB_ENV
          echo "PRERELEASE=${PRERELEASE}" >> $GITHUB_ENV
      - name: "Create release"
        uses: "actions/github-script@v8"
        with:
          script: |
            try {
              const fs = await import('fs');
              const release = await github.rest.repos.createRelease(
                {
                  tag_name: process.env.TAG_NAME,
                  name: process.env.RELEASE_NAME,
                  body: process.env.RELEASE_BODY,
                  draft: true,
                  prerelease: process.env.PRERELEASE === 'true',
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
              await github.rest.repos.uploadReleaseAsset(
                {
                  release_id: release.data.id,
                  name: process.env.PACKAGE_BASENAME,
                  data: fs.readFileSync(process.env.PACKAGE_PATH),
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
              await github.rest.repos.updateRelease(
                {
                  release_id: release.data.id,
                  draft: false,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
            } catch (error) {
              core.setFailed(error.message);
            }
      - name: "Verify XML download URL"
        if: ${{ !cancelled() }}
        run: |
          PLUGIN_KEY=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          XML_FILE=""
          for candidate in "plugin.xml" "${PLUGIN_KEY}.xml"; do
            if [[ -f "$candidate" ]]; then
              XML_FILE="$candidate"
              break
            fi
          done
          if [[ -z "$XML_FILE" ]]; then
            echo "No plugin XML file found, skipping check."
            exit 0
          fi
          EXPECTED_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/${{ env.PACKAGE_BASENAME }}"
          XML_URL=$(grep -oP '(?<=<download_url>)[^<]+' "$XML_FILE" | grep "/${{ env.TAG_NAME }}/" | head -1)
          if [[ -z "$XML_URL" ]]; then
            echo "No <download_url> entry for tag ${{ env.TAG_NAME }} in $XML_FILE, skipping check."
            exit 0
          fi
          if [[ "$XML_URL" != "$EXPECTED_URL" ]]; then
            echo "❌ URL mismatch in $XML_FILE:"
            echo "   Found:       $XML_URL"
            echo "   Working URL: $EXPECTED_URL"
            exit 1
          fi
          echo "✅ XML download URL matches the published asset: $XML_URL"

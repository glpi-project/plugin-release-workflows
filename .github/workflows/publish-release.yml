name: "Publish release"

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: "${{ github.ref_name }}"
      release-name:
        required: false
        type: string
        default: "${{ github.ref_name }}"
      release-body:
        required: false
        type: string
        default: ""
      bot-client-id:
        description: "GitHub App client ID. Used when `bot-token` is not given."
        required: false
        type: string
        default: ""
    secrets:
      bot-token:
        description: "A ready-made token (PAT or GitHub App token), used as is. When no token is given, the workflow `GITHUB_TOKEN` is used."
        required: false
      bot-private-key:
        description: "Private key of the `bot-client-id` GitHub App."
        required: false
      github-token:
        description: "Deprecated: alias of `bot-token`."
        required: false

jobs:
  publish-release:
    name: "Publish release"
    runs-on: "ubuntu-latest"
    container:
      image: "ghcr.io/glpi-project/githubactions-glpi-apache:latest"
      options: --user 1001 # using built-in image user, otherwise GitHub Actions can't write file to the container
    steps:
      - name: "Checkout setup.php"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.tag }}"
          sparse-checkout: setup.php
          path: tmp_setup
          persist-credentials: false
      - name: "Get Plugin Key"
        run: |
          PLUGIN_KEY=$(sed --quiet 's/.*function plugin_version_\([a-z0-9_]\+\).*/\1/p' tmp_setup/setup.php | head --lines=1)
          if [ -z "$PLUGIN_KEY" ]; then
            echo "Could not extract plugin key from setup.php"
            exit 1
          fi
          echo "PLUGIN_KEY=$PLUGIN_KEY" >> "$GITHUB_ENV"
      - name: "Checkout Plugin"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          ref: "${{ inputs.tag }}"
          fetch-tags: true
          fetch-depth: 0
          path: plugins/${{ env.PLUGIN_KEY }}
          persist-credentials: false
      - name: "Link Plugin to GLPI"
        run: |
          sudo ln -s "$GITHUB_WORKSPACE/plugins/$PLUGIN_KEY" "/var/www/glpi/plugins/$PLUGIN_KEY"
          # Fix permissions for logs and other writable dirs
          # Open the whole tree for writing so any tool (present or future) can write wherever it needs to.
          sudo mkdir -p /var/www/glpi/tests/files/_log
          sudo chmod -R a+rwX /var/www/glpi/
          # Ensure git trusts the directory
          git config --global --add safe.directory '*'
      - name: "Build release archive"
        working-directory: /var/www/glpi/
        env:
          INPUT_TAG: "${{ inputs.tag }}"
        run: |
          php bin/console tools:plugin:release --plugin="${PLUGIN_KEY}" --dest="plugins/${PLUGIN_KEY}/dist/glpi-${PLUGIN_KEY}-${INPUT_TAG}.tar.bz2" --no-interaction --force --verbose
          PACKAGE_PATH=$(find "/var/www/glpi/plugins/${PLUGIN_KEY}/dist/" -type f -name '*.tar.bz2')
          # Use the multiline GITHUB_ENV syntax with a random delimiter, so values containing newlines are preserved and cannot end the block early or inject other variables.
          DELIMITER="EOF_$(od --address-radix=n --read-bytes=16 --format=x1 /dev/urandom | tr --delete ' \n')"
          {
            printf '%s\n' "PACKAGE_PATH<<${DELIMITER}"
            printf '%s\n' "${PACKAGE_PATH}"
            printf '%s\n' "${DELIMITER}"
            printf '%s\n' "PACKAGE_BASENAME<<${DELIMITER}"
            basename "${PACKAGE_PATH}"
            printf '%s\n' "${DELIMITER}"
          } >> "$GITHUB_ENV"
      - name: "Compute values"
        working-directory: /var/www/glpi/plugins/${{ env.PLUGIN_KEY }}/
        shell: bash -e {0}
        env:
          INPUT_TAG: "${{ inputs.tag }}"
          INPUT_RELEASE_NAME: "${{ inputs.release-name }}"
          INPUT_RELEASE_BODY: "${{ inputs.release-body }}"
        run: |
          TAG_NAME="${INPUT_TAG}"
          RELEASE_NAME="${INPUT_RELEASE_NAME}"
          RELEASE_BODY="${INPUT_RELEASE_BODY}"
          if [[ -z "${RELEASE_BODY}" && -f "CHANGELOG.md" ]]; then
            RELEASE_BODY="See [CHANGELOG.md](CHANGELOG.md) for changes details."
          fi
          MIN_GLPI=$(grep -oP "define\s*\(\s*['\"]PLUGIN_[A-Z0-9_]+_MIN_GLPI(?:_VERSION)?['\"]\s*,\s*['\"]\K[^'\"]+(?=['\"])" setup.php 2>/dev/null | head --lines=1 || true)
          MAX_GLPI=$(grep -oP "define\s*\(\s*['\"]PLUGIN_[A-Z0-9_]+_MAX_GLPI(?:_VERSION)?['\"]\s*,\s*['\"]\K[^'\"]+(?=['\"])" setup.php 2>/dev/null | head --lines=1 || true)
          if [[ -n "${MIN_GLPI}" && -n "${MAX_GLPI}" ]]; then
            COMPAT="**Compatible GLPI**: ${MIN_GLPI} -- ${MAX_GLPI}"
            if [[ -n "${RELEASE_BODY}" ]]; then
              RELEASE_BODY="${COMPAT}"$'\n\n'"${RELEASE_BODY}"
            else
              RELEASE_BODY="${COMPAT}"
            fi
          fi
          if [[ $( echo "${TAG_NAME}" | grep --extended-regexp "\-(alpha|beta|rc)[0-9]*$" ) ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          # Use the multiline GITHUB_ENV syntax with a random delimiter, so values containing newlines are preserved and cannot end the block early or inject other variables.
          DELIMITER="EOF_$(od --address-radix=n --read-bytes=16 --format=x1 /dev/urandom | tr --delete ' \n')"
          {
            printf '%s\n' "TAG_NAME<<${DELIMITER}"
            printf '%s\n' "${TAG_NAME}"
            printf '%s\n' "${DELIMITER}"
            printf '%s\n' "RELEASE_NAME<<${DELIMITER}"
            printf '%s\n' "${RELEASE_NAME}"
            printf '%s\n' "${DELIMITER}"
            printf '%s\n' "RELEASE_BODY<<${DELIMITER}"
            printf '%s\n' "${RELEASE_BODY}"
            printf '%s\n' "${DELIMITER}"
          } >> "$GITHUB_ENV"
          echo "PRERELEASE=${PRERELEASE}" >> "$GITHUB_ENV"
      - name: "Resolve token"
        shell: bash -e {0}
        env:
          HAS_BOT_TOKEN: ${{ secrets.bot-token != '' || secrets.github-token != '' }}
          BOT_CLIENT_ID: ${{ inputs.bot-client-id }}
          HAS_BOT_PRIVATE_KEY: ${{ secrets.bot-private-key != '' }}
        run: |
          USE_BOT_APP=no
          if [[ -n "${BOT_CLIENT_ID}" && "${HAS_BOT_PRIVATE_KEY}" != "true" ]]; then
            echo "::error::The bot-private-key secret is required when bot-client-id is set."
            exit 1
          fi
          if [[ "${HAS_BOT_TOKEN}" != "true" ]]; then
            if [[ -n "${BOT_CLIENT_ID}" ]]; then
              USE_BOT_APP=yes
            fi
          fi
          echo "USE_BOT_APP=${USE_BOT_APP}" >> "$GITHUB_ENV"
      - name: "Generate bot token"
        if: ${{ env.USE_BOT_APP == 'yes' }}
        id: "bot-app-token"
        uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510" # v3.3.0
        with:
          client-id: ${{ inputs.bot-client-id }}
          private-key: ${{ secrets.bot-private-key }}
          permission-contents: "write"
      - name: "Create release"
        uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
        with:
          github-token: ${{ secrets.bot-token || secrets.github-token || steps.bot-app-token.outputs.token || github.token }}
          script: |
            try {
              const fs = await import('fs');
              const release = await github.rest.repos.createRelease(
                {
                  tag_name: process.env.TAG_NAME,
                  name: process.env.RELEASE_NAME,
                  body: process.env.RELEASE_BODY,
                  draft: true,
                  prerelease: process.env.PRERELEASE === 'true',
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
              await github.rest.repos.uploadReleaseAsset(
                {
                  release_id: release.data.id,
                  name: process.env.PACKAGE_BASENAME,
                  data: fs.readFileSync(process.env.PACKAGE_PATH),
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
              await github.rest.repos.updateRelease(
                {
                  release_id: release.data.id,
                  draft: false,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
            } catch (error) {
              core.setFailed(error.message);
            }
      - name: "Verify XML download URL"
        if: ${{ !cancelled() }}
        working-directory: plugins/${{ env.PLUGIN_KEY }}/
        shell: bash -e {0}
        run: |
          XML_FILE=""
          for candidate in "plugin.xml" "${PLUGIN_KEY}.xml"; do
            if [[ -f "$candidate" ]]; then
              XML_FILE="$candidate"
              break
            fi
          done
          if [[ -z "$XML_FILE" ]]; then
            echo "No plugin XML file found, skipping check."
            exit 0
          fi
          EXPECTED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${PACKAGE_BASENAME}"
          XML_URL=$(grep -oP '(?<=<download_url>)[^<]+' "$XML_FILE" | grep "/${TAG_NAME}/" | head -1)
          if [[ -z "$XML_URL" ]]; then
            echo "No <download_url> entry for tag ${TAG_NAME} in $XML_FILE, skipping check."
            exit 0
          fi
          if [[ "$XML_URL" != "$EXPECTED_URL" ]]; then
            echo "❌ URL mismatch in $XML_FILE:"
            echo "   Found:       $XML_URL"
            echo "   Working URL: $EXPECTED_URL"
            exit 1
          fi
          echo "✅ XML download URL matches the published asset: $XML_URL"
      - name: "Open plugin XML update PR on default branch"
        # Non-blocking: the release is already published, and consumers may lack the `pull-requests: write` permission.
        continue-on-error: true
        uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
        env:
          DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        with:
          github-token: ${{ secrets.bot-token || secrets.github-token || steps.bot-app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.TAG_NAME;
            const fs = await import('fs');
            const base = process.env.DEFAULT_BRANCH
              || (await github.rest.repos.get({ owner, repo })).data.default_branch;
            const pluginDir = `plugins/${process.env.PLUGIN_KEY}`;
            const xmlPath = ['plugin.xml', `${process.env.PLUGIN_KEY}.xml`].find((candidate) => fs.existsSync(`${pluginDir}/${candidate}`));
            if (xmlPath === undefined) {
              core.info('No plugin XML file found, skipping update.');
              return;
            }

            // The tag's XML already holds the block (checked by the previous step): copy it as is.
            const escapedTag = tag.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const existingRe = new RegExp(`[ \\t]*<version>\\s*<num>\\s*${escapedTag}\\s*</num>[\\s\\S]*?</version>`);
            const block = fs.readFileSync(`${pluginDir}/${xmlPath}`, 'utf8').match(existingRe)?.[0];
            if (block === undefined) {
              core.info(`No <version> block for ${tag} in the tag's ${xmlPath}, skipping update.`);
              return;
            }

            let xml;
            try {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: xmlPath, ref: base });
              xml = Buffer.from(data.content, 'base64').toString('utf8');
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`No ${xmlPath} on ${base}, skipping update.`);
              return;
            }

            let updated;
            if (existingRe.test(xml)) {
              updated = xml.replace(existingRe, () => block);
            } else if (/<versions>[ \t]*\r?\n/.test(xml)) {
              // Newest first: the block goes right after <versions>.
              updated = xml.replace(/<versions>[ \t]*(\r?\n)/, (match, eol) => `${match}${block}${eol}`);
            } else {
              core.warning(`No <versions> element found in ${xmlPath} on ${base}, skipping update.`);
              return;
            }
            if (updated === xml) {
              core.info(`${xmlPath} on ${base} already contains version ${tag}.`);
              return;
            }

            const branch = `release-xml/${tag}`;
            const baseSha = (await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` })).data.object.sha;
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseSha });
            } catch (error) {
              // 422: branch left by a previous run, reset it onto the default branch.
              if (error.status !== 422) {
                throw error;
              }
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: baseSha, force: true });
            }
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path: xmlPath, ref: branch });
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: xmlPath,
              branch,
              sha: file.sha,
              message: `Add version ${tag} to ${xmlPath}`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
            });

            const { data: openPulls } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${branch}`, base, state: 'open' });
            if (openPulls.length > 0) {
              core.info(`Updated existing PR: ${openPulls[0].html_url}`);
              return;
            }
            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base,
              title: `Add version ${tag} to ${xmlPath}`,
              body: `Copies the \`${tag}\` version block from the tag's \`${xmlPath}\` to \`${base}\`, so that the plugins catalog lists it.`,
            });
            core.info(`Opened PR: ${pull.html_url}`);

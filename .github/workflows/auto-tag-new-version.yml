name: "Automatically tag new version"

on:
  workflow_call:
    inputs:
      # GitHub App client ID. Used when `bot-token` is not given.
      # Defaults to the `GLPI_PROJECT_BOT_CLIENT_ID` variable.
      bot-client-id:
        required: false
        type: string
        default: ""
    secrets:
      # A ready-made token (PAT or GitHub App token), used as is.
      bot-token:
        required: false
      # Private key of the `bot-client-id` GitHub App.
      bot-private-key:
        required: false
      # Deprecated: alias of `bot-token`.
      github-token:
        required: false
      # Org-wide fallback of `bot-private-key`
      GLPI_PROJECT_BOT_PRIVATE_KEY:
        required: false

jobs:
  auto-tag-new-version:
    name: "Automatically tag new version"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0 # see https://github.com/actions/checkout/issues/1471
          fetch-tags: true
          persist-credentials: false
      - name: "Extract version"
        run: |
          VERSION=$(grep -oP "define\s*\(\s*['\"]PLUGIN_[A-Z]+_VERSION['\"]\s*,\s*['\"]\K[^'\"]+(?=['\"]\s*\))" setup.php)
          if [[ -n "${VERSION}" ]] && ! git check-ref-format "refs/tags/${VERSION}"; then
            echo "Invalid version extracted from setup.php: ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: "Check if tag exists"
        run: |
          CREATE_TAG=no
          if [[ ! -z "${VERSION}" && -z "$(git tag -l "${VERSION}")" ]]; then
            CREATE_TAG=yes
          fi
          echo "CREATE_TAG=${CREATE_TAG}" >> "$GITHUB_ENV"
      - name: "Resolve token"
        if: ${{ env.CREATE_TAG == 'yes' }}
        env:
          HAS_BOT_TOKEN: ${{ secrets.bot-token != '' || secrets.github-token != '' }}
          INPUT_BOT_CLIENT_ID: ${{ inputs.bot-client-id }}
          BOT_CLIENT_ID: ${{ inputs.bot-client-id || vars.GLPI_PROJECT_BOT_CLIENT_ID }}
          HAS_BOT_PRIVATE_KEY: ${{ secrets.bot-private-key != '' || secrets.GLPI_PROJECT_BOT_PRIVATE_KEY != '' }}
        run: |
          USE_BOT_APP=no
          if [[ "${HAS_BOT_TOKEN}" != "true" ]]; then
            if [[ -n "${BOT_CLIENT_ID}" && "${HAS_BOT_PRIVATE_KEY}" == "true" ]]; then
              USE_BOT_APP=yes
            elif [[ -n "${INPUT_BOT_CLIENT_ID}" ]]; then
              echo "::error::The bot-private-key secret is required when bot-client-id is set."
              exit 1
            else
              echo "::error::Either the bot-token secret, or the bot-client-id input and the bot-private-key secret (or the GLPI_PROJECT_BOT_CLIENT_ID variable and the GLPI_PROJECT_BOT_PRIVATE_KEY secret), are required."
              exit 1
            fi
          fi
          echo "USE_BOT_APP=${USE_BOT_APP}" >> "$GITHUB_ENV"
      - name: "Generate bot token"
        if: ${{ env.CREATE_TAG == 'yes' && env.USE_BOT_APP == 'yes' }}
        id: "bot-app-token"
        uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510" # v3.3.0
        with:
          client-id: ${{ inputs.bot-client-id || vars.GLPI_PROJECT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.bot-private-key || secrets.GLPI_PROJECT_BOT_PRIVATE_KEY }}
          permission-contents: "write"
      - name: "Create tag"
        if: ${{ env.CREATE_TAG == 'yes' }}
        uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
        with:
          # A PAT or a GitHub App token is required.
          # From https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow:
          # > When you use the repository's GITHUB_TOKEN to perform tasks, events triggered by the GITHUB_TOKEN,
          # > with the exception of workflow_dispatch and repository_dispatch, will not create a new workflow run.
          # > This prevents you from accidentally creating recursive workflow runs. For example, if a workflow run pushes
          # > code using the repository's GITHUB_TOKEN, a new workflow will not run even when the repository
          # > contains a workflow configured to run when push events occur.
          github-token: ${{ secrets.bot-token || secrets.github-token || steps.bot-app-token.outputs.token }}
          script: |
            try {
              await github.rest.git.createRef(
                {
                  ref: `refs/tags/${process.env.VERSION}`,
                  sha: context.sha,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                }
              );
            } catch (error) {
              core.setFailed(error.message);
            }
